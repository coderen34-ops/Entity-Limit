name: KoninskiEntityLimit
version: 1.2.0
main: tr.com.koninski.limit.KoninskiEntityLimit
api-version: '26.2'
softdepend: [GriefPrevention]
description: Chunk ve çevresi için yeni üretim sınırları. Mevcut entityleri silmez.
commands:
  entitylimit:
    description: Mevcut chunk sınırlarını görüntüler; reload ayarları yeniler.
    usage: /entitylimit [reload]
  optimize:
    description: Sunucu optimizasyon aracı (rapor, güvenli temizlik, durum).
    usage: /optimize <rapor [dünya]|temizle <hedef> [--onayla]|durum|reload>
    permission: koninski.optimize.admin
  lobotomi:
    description: Köylü lobotomisi (araçtaki/sıkışmış köylülerin beyin tick'ini azaltır).
    usage: /lobotomi <durum|rapor|ac|kapat|reload>
    permission: koninski.optimize.admin
permissions:
  koninski.entitylimit.admin:
    default: op
  koninski.optimize.admin:
    description: /optimize ve /entitylimit görüntüleme
    default: op
  koninski.optimize.bypass:
    description: Blok (huni vb.) chunk sınırından muaf
    default: false
