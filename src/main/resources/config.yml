# Bir chunk 16x16 bloktur; yükseklik boyunca tek limit uygulanır.
# Hayvanlar birlikte sayılır: 32 tavuk + 32 koyun değil, toplam 32.
# Bölge limiti, üretimin merkezindeki yüklü 3x3 chunk için uygulanır.
# Taşıma/ışınlanma engellenmez. Mevcut entityler silinmez.
enabled: true
groups:
  farm:
    label: Çiftlik hayvanı
    per-chunk: 32
    per-area: 96
    types: [CHICKEN, COW, SHEEP, PIG, MOOSHROOM, MUSHROOM_COW]
    suffixes: []
  villagers:
    label: Köylü
    per-chunk: 16
    per-area: 32
    types: [VILLAGER, ZOMBIE_VILLAGER]
    suffixes: []
  vehicles:
    label: Tekne/vagon
    per-chunk: 16
    per-area: 48
    types: [BOAT, CHEST_BOAT, MINECART]
    suffixes: [_BOAT, _RAFT, _MINECART]
  # --- 1.1.0 yeni gruplar ---
  # spawn-reasons: doluysa grup SADECE bu doğma sebeplerinde uygulanır (üreme/yerleştirmeye uygulanmaz).
  # ignored-spawn-reasons (grup içinde): bu gruba özel ek yok sayılan sebepler. aktif: false ile grup kapatılır.
  canavarlar:
    label: Canavar
    aktif: true
    per-chunk: 12
    per-area: 40
    types: [ZOMBIE, HUSK, DROWNED, SKELETON, STRAY, BOGGED, CREEPER, SPIDER, CAVE_SPIDER, ENDERMAN, WITCH, SLIME, PHANTOM, PILLAGER]
    suffixes: []
    # Sadece doğal doğmalar; spawner, mob farm, yumurta ve komutlar etkilenmez.
    # RAID bilerek yok: baskın dalgaları sınırlanırsa baskın tamamlanamayabilir.
    spawn-reasons: [NATURAL, REINFORCEMENTS, PATROL, VILLAGE_INVASION]
    ignored-spawn-reasons: [SPAWNER, TRIAL_SPAWNER, SPAWNER_EGG, DISPENSE_EGG, CUSTOM, COMMAND, SLIME_SPLIT, DROWNED, RAID]
  ambient:
    label: Yarasa
    aktif: true
    per-chunk: 2
    per-area: 6
    types: [BAT]
    suffixes: []
    spawn-reasons: [NATURAL]
  su:
    label: Su canlısı
    aktif: true
    per-chunk: 12
    per-area: 36
    types: [COD, SALMON, TROPICAL_FISH, PUFFERFISH, SQUID, GLOW_SQUID]
    suffixes: []
    # Kova ile bırakılan balıklar (BUCKET) etkilenmez
    spawn-reasons: [NATURAL, CHUNK_GEN]
  diger_hayvanlar:
    label: Diğer hayvan
    aktif: true
    per-chunk: 6
    per-area: 16
    types: [FROG, PANDA, CAT, OCELOT, FOX, PARROT, RABBIT, TURTLE, ARMADILLO, GOAT]
    suffixes: []
# Yeni çoğalma yerine mevcut bir canlı dönüştürülüyorsa iptal etme.
# Böylece mantar ineği kırpma ve zombi köylü iyileştirme bozulmaz.
ignored-spawn-reasons: [CURED, INFECTION, SHEARED, LIGHTNING, SHOULDER_ENTITY, BEEHIVE]
message-cooldown-seconds: 3

# ================================================================
#  1.1.0 - SUNUCU OPTİMİZASYON ARACI  (/optimize, yetki: koninski.optimize.admin)
#  Silme/kaldırma işlemleri varsayılan olarak deneme (dry-run): /optimize temizle ... --onayla olmadan hiçbir şey silinmez.
# ================================================================
config-surum: 3

optimize:
  # Rapor ve temizlik taramasında tick başına işlenecek yüklü chunk (yüksek = daha hızlı ama tick başına daha çok iş)
  tarama-chunk-per-tick: 20

yerdeki-esya:
  # Chunk başına yerdeki eşya uyarı eşiği. Yeni düşen eşya ENGELLENMEZ (eşya kaybı olmasın); sadece raporda işaretlenir
  # ve "/optimize temizle esya" bu eşiği aşan chunk'larda fazlayı kaldırır.
  uyari-esigi: 150
  # Temizlikte sadece bu kadar dakikadan eski, isimsiz/lore'suz/PDC'siz sıradan eşyalar kaldırılır (para asla).
  # Not: Minecraft yerdeki eşyayı 5 dakikada kendisi siler; bu yüzden 5'ten küçük olmalı.
  temizlik-yas-dakika: 2

blok-limitleri:
  # Yeni yerleştirilen bloklar için chunk başına üst sınır. Aşılırsa yerleştirme iptal edilir, mevcut bloklar ASLA silinmez.
  aktif: true
  # GriefPrevention kuruluysa, kendi arazisinde yerleştirenler sınırdan muaf olsun mu?
  arazi-muafiyeti: false
  limitler:
    HOPPER: 24
    DROPPER: 16
    DISPENSER: 16
    CRAFTER: 16
    FURNACE: 32
    BLAST_FURNACE: 16
    SMOKER: 16

temizlik:
  # Oyuncuya bu kadar blok yakın olan entity/eşyaya dokunulmaz.
  oyuncu-koruma-yaricapi: 24
  # true: PersistentDataContainer'ında HERHANGİ bir anahtar olan entity korunur (önerilen; NPC'ler, klan/meslek eşyaları).
  herhangi-pdc-koru: true
  # herhangi-pdc-koru false yapılırsa sadece bu eklentilerin anahtarları korunur. Eşya üzerindeki PDC (para vb.) her zaman korunur.
  korumali-pdc-namespaceler: [economy, mesleksistemi, klansistemi, arenaligi, tagplugin]
  # Araçtaki (vagon/tekne) köylüler: RAPOR = sadece göster, INDIR = araçtan indir, INDIR_VE_ARACI_SIL = indir ve boş aracı sil.
  # Adı, mesleği ya da PDC'si olan köylüye dokunulmaz; köylü hiçbir modda silinmez.
  koylu-arac-islem: RAPOR

yuk-modu:
  # TPS düşünce yeni doğal canavar/yarasa doğmasını geçici durdurur. Varsayılan KAPALI.
  aktif: false
  kontrol-saniye: 10
  acilis-tps: 16.0      # 1 dakikalık ortalama TPS bunun altına düşünce açılır
  kapanis-tps: 18.5     # bunun üstüne çıkınca kapanır (titreşim olmasın diye arada boşluk var)
  admin-bildirimi: true
  # Sadece bu sebeplerle doğanlar durdurulur; spawner, mob farm, yumurta, komut ve üreme hiçbir zaman etkilenmez.
  iptal-sebepleri: [NATURAL]
  kategoriler: [canavar, ambient]

# ================================================================
#  1.2.0 - KÖYLÜ LOBOTOMİSİ  (/lobotomi, yetki: koninski.optimize.admin)
#  Araçtaki ya da sıkışmış köylülerin beyni kapatılır (setAware false); takas ve yeniden stok için
#  periyodik kısa uyandırma penceresi verilir. Oyuncu yaklaşınca, takas başlayınca ya da köylü araçtan
#  inince hemen tamamen uyandırılır. Eklenti kapanırken ve chunk boşaltılmadan önce herkes uyandırılır.
# ================================================================
lobotomi:
  aktif: true
  # Zamanlayıcı kaç tick'te bir çalışır (20 = 1 sn). Oyuncu yaklaşınca en geç bu sürede uyanır.
  tarama-araligi-tick: 20
  # Her çalışmada yeni aday aramak için taranacak yüklü chunk sayısı (chunk yüklenmez)
  tarama-chunk-per-tick: 20
  # Bu kadar blok yakınında oyuncu olan köylü normal çalışır (takas salonuna giren oyuncu fark etmez)
  oyuncu-yakinlik-yaricapi: 16
  # Uyutulan köylü her uyandirma-araligi tick'te bir, uyandirma-suresi tick boyunca uyanır (yeniden stok, iş/yatak)
  uyandirma-araligi: 100
  uyandirma-suresi: 3
  # Sıkışıklık (etrafında yürüyecek yer yok) kontrolü köylü başına en fazla bu aralıkla yeniden yapılır
  degerlendirme-araligi: 300
  # Minecart/tekne vb. içindeki köylüler aday mı?
  arac-ici-aday: true
  # Hareket edemeyen (4 yanı kapalı) köylüler aday mı?
  sikisik-aday: true
  # Mesleği olmayan (NONE) köylüler de uyutulabilsin mi? (nitwit her zaman uyutulabilir)
  lobotomi-meslegi-olmayanlar: true
  # İsimli köylülere asla dokunulmaz. true: PDC'sinde HERHANGİ bir eklenti anahtarı olan köylü korunur (NPC'ler).
  herhangi-pdc-koru: true
  # herhangi-pdc-koru false yapılırsa sadece bu eklentilerin anahtarları korunur
  korumali-pdc-namespaceler: [economy, mesleksistemi, klansistemi, arenaligi, tagplugin]
